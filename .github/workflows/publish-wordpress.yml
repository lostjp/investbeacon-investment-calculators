name: Publish WordPress plugin

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified release to WordPress.org (leave unchecked for validation only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wordpress-org-investbeacon-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out approved release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release and run publisher tests
        run: |
          python3 -m unittest -v test_publish.py
          python3 publish_wordpress.py
      - name: Install SVN client on cloud runner
        if: inputs.publish
        run: |
          if ! command -v svn >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y subversion
          fi
          svn --version --quiet
      - name: Publish verified release to WordPress.org
        if: inputs.publish
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: python3 publish_wordpress.py --publish
